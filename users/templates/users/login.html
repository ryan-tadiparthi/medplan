{% extends 'core/base.html' %}
{% load static %}

{% block title %}
    Login
{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'users/css/login.css' %}">
{% endblock %}

{% block content %}


<h1>Login</h1>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Login</button>
</form>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'core/js/login.js' %}"></script>
{% endblock %}
