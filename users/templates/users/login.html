{% extends 'core/base.html' %}
{% load static %}

{% block title %}
    Login
{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'users/css/login.css' %}">
{% endblock %}

{% block content %}

<!-- 
<h1>Login</h1>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Login</button>
</form> -->

    <!-- Main Auth Form -->
    <main>
        <div class="container">
            <div class="card">
                <div class="header">
                    <div class="logo-auth">medplan</div>
                    <h1 class="title">Welcome back</h1>
                    <p class="subtitle">Sign in to your account</p>
                </div>
 
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" placeholder="you@example.com" required>
                        <div class="error" id="loginEmailError"></div>
                    </div>
 
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                        <div class="error" id="loginPasswordError"></div>
                    </div>
 
                    <button type="button" class="btn btn-primary" onclick="handleLogin()">Sign in</button>
                    <a href="signup.html" class="btn btn-secondary" style="display: flex; align-items: center; justify-content: center;">Create account</a>
 
                    <div class="toggle-auth">
                        Don't have an account? <a href="signup.html">Sign up</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
 
    
{% endblock %}

{% block extra_js %}
    <script src="{% static 'core/js/login.js' %}"></script>
{% endblock %}
